name: Compile CVs & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout auto-cv repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Setup Typst
        uses: typst-community/setup-typst@v3
        with:
          typst-version: "latest"

      - name: Compile CV PDFs
        run: |
          python3 autocv.py generate --lang pt --output output/CV_portugues.pdf
          python3 autocv.py generate --lang en --output output/CV_english.pdf

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest CV Builds"
          body: "Automated build of latest CV versions in Portuguese and English."
          files: |
            output/CV_portugues.pdf
            output/CV_english.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Optional Sync to Portfolio via PAT
        env:
          PORTFOLIO_TOKEN: ${{ secrets.PORTFOLIO_SYNC_TOKEN }}
        run: |
          if [ -n "$PORTFOLIO_TOKEN" ]; then
            echo "Syncing directly to portfolio repository..."
            git clone "https://x-access-token:${PORTFOLIO_TOKEN}@github.com/joao-zip/joao-zip.github.io.git" portfolio_repo
            mkdir -p portfolio_repo/public/cv
            cp output/CV_portugues.pdf portfolio_repo/public/cv/CV_portugues.pdf
            cp output/CV_english.pdf portfolio_repo/public/cv/CV_english.pdf
            cd portfolio_repo
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            if [[ -n $(git status --porcelain) ]]; then
              git add public/cv/
              git commit -m "chore(cv): auto-sync latest CVs from auto-cv"
              git push origin main
              echo "Synced successfully to joao-zip.github.io!"
            else
              echo "Portfolio CVs are already up to date."
            fi
          else
            echo "PORTFOLIO_SYNC_TOKEN secret not set. Release created at https://github.com/joao-zip/auto-cv/releases/latest"
          fi
